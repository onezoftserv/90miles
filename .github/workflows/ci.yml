# build-verification spec: import, smoke run and GUT on every push to main and every PR,
# on the exact engine release the project targets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to main gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.7.2"
  # SHA-512 of Godot_v4.7.2-stable_linux.x86_64.zip from the official SHA512-SUMS.txt.
  # Update together with GODOT_VERSION.
  GODOT_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"

jobs:
  godot:
    name: Godot headless checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-${{ env.GODOT_SHA512 }}

      - name: Install Godot
        run: |
          set -euo pipefail
          bin="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p ~/godot
          cd ~/godot
          if [ ! -x "$bin" ]; then
            curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${bin}.zip"
            echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
            unzip -q godot.zip
            rm godot.zip
          fi
          echo "GODOT=$HOME/godot/$bin" >> "$GITHUB_ENV"

      - name: Engine version matches the project
        run: |
          set -euo pipefail
          version="$("$GODOT" --headless --version)"
          echo "engine: $version"
          case "$version" in
            "${GODOT_VERSION}.stable"*) ;;
            *) echo "::error::expected Godot ${GODOT_VERSION}, got ${version}"; exit 1 ;;
          esac
          minor="${GODOT_VERSION%.*}"
          if ! grep -q "config/features=PackedStringArray(\"${minor}\"" game/project.godot; then
            echo "::error::game/project.godot does not declare engine ${minor}"
            exit 1
          fi

      # Godot can exit 0 after logging errors, so these two steps also fail on any error line.
      - name: Import project
        run: |
          set -o pipefail
          timeout 300 "$GODOT" --headless --path game --import 2>&1 | tee import.log
          if sed 's/\x1b\[[0-9;]*m//g' import.log | grep -E '^(ERROR|SCRIPT ERROR):'; then
            echo "::error::errors during import"; exit 1
          fi

      - name: Smoke run
        run: timeout 60 "$GODOT" --headless --path game -s res://tests/smoke.gd

      # Runs the real game loop (autoloads first, then the main scene) to catch runtime errors in
      # autoloads and scenes outside the smoke script, and resource leaks reported at exit.
      - name: Run the game headless
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path game --quit-after 300 2>&1 | tee run.log
          if sed 's/\x1b\[[0-9;]*m//g' run.log | grep -E '^(ERROR|SCRIPT ERROR):'; then
            echo "::error::errors while running the game"; exit 1
          fi

      - name: Unit tests (GUT)
        run: timeout 300 "$GODOT" --headless --path game -s res://addons/gut/gut_cmdln.gd -gexit
